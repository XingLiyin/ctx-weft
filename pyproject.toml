[project]
name = "ctx-weft"
version = "0.1.0"
description = "Protocol-based Agent Runtime Core: Knowledge / Memory / Capability."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.27.2",
    "python-ulid>=2.0",
    "typing-extensions>=4.0",
]

[project.optional-dependencies]
builtin = ["httpx>=0.27", "psutil>=5.9.0"]
mcp     = ["httpx>=0.27", "mcp>=1.27.1"]
skills  = ["httpx>=0.27", "psutil>=5.9.0"]
llm     = ["httpx>=0.27"]
dev     = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctx_weft"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
addopts      = "-ra -q --strict-markers"

[tool.ruff]
line-length    = 100
target-version = "py311"
src            = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]
